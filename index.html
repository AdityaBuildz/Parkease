<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock · Paper · Scissors ✂️📄🪨</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Rock · Paper · Scissors</h1>
      <p class="subtitle">Play vs Computer · R/P/S shortcuts</p>
    </header>

    <section class="scoreboard">
      <div class="score"><span>You</span><strong id="score-user">0</strong></div>
      <div class="score"><span>Computer</span><strong id="score-comp">0</strong></div>
    </section>

    <section class="status">
      <p id="status-text">Make your move!</p>
    </section>

    <section class="buttons">
      <button class="choice" data-choice="rock" aria-label="Rock">🪨 Rock</button>
      <button class="choice" data-choice="paper" aria-label="Paper">📄 Paper</button>
      <button class="choice" data-choice="scissors" aria-label="Scissors">✂️ Scissors</button>
    </section>

    <section class="history">
      <h2>History</h2>
      <ul id="history-list"></ul>
    </section>

    <footer>
      <button id="reset-btn" class="secondary">Reset Scores</button>
      <a href="https://en.wikipedia.org/wiki/Rock_paper_scissors" target="_blank" rel="noopener" class="secondary">About</a>
    </footer>
  </main>

  <audio id="sound-win" src="sounds/win.mp3" preload="auto"></audio>
  <audio id="sound-lose" src="sounds/lose.mp3" preload="auto"></audio>
  <audio id="sound-draw" src="sounds/draw.mp3" preload="auto"></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
